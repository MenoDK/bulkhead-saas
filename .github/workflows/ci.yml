name: ci

on:
  push: { branches: [main] }
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API (lint, types, unit, e2e against Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: app }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build
      - name: End-to-end tests (real Postgres, row-level security, concurrency)
        run: pnpm test:e2e
        env:
          TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/app

  web:
    name: Web (lint, types, tests, build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults: { run: { working-directory: web } }
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { package_json_file: web/package.json }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, cache-dependency-path: web/pnpm-lock.yaml }
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: pnpm build

  stack:
    name: Stack (docker compose + black-box smoke test)
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: make env
      - name: make env is idempotent (a second run must not rotate the database password)
        run: |
          cp .env "$RUNNER_TEMP/env.first"
          make env
          cmp .env "$RUNNER_TEMP/env.first"
      - run: docker compose up -d --build --wait
      - run: ./scripts/smoke.sh http://localhost:8080
      - name: Stop and start again on the same volume (what a visitor does on the second try)
        run: |
          make down
          make up
          ./scripts/smoke.sh http://localhost:8080
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - run: docker compose down -v

  security:
    name: Security (secrets, Dockerfiles, dependencies)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      # The binary, pinned and checksum-verified, instead of gitleaks-action: the action scans "<first commit>^..HEAD",
      # and the first commit of a new repository has no parent, so it fails on the very first push.
      - name: Install gitleaks (pinned, checksum verified)
        run: |
          v=8.24.3
          base=https://github.com/gitleaks/gitleaks/releases/download/v$v
          archive=gitleaks_${v}_linux_x64.tar.gz # keep the release's file name: the checksum list refers to it
          curl -sSfLO "$base/$archive"
          curl -sSfLO "$base/gitleaks_${v}_checksums.txt"
          sha256sum --check --ignore-missing "gitleaks_${v}_checksums.txt" | grep -F "$archive: OK"
          tar xzf "$archive" gitleaks
      - name: Secret scan (full history)
        run: ./gitleaks git --no-banner --redact -v .
      - name: Lint Dockerfiles
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: Dockerfile, failure-threshold: warning }
      - name: Lint web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with: { dockerfile: web/Dockerfile, failure-threshold: warning }
      - uses: pnpm/action-setup@v4
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high

  browser:
    name: Browser (landing, lab, 14 languages, console; Playwright + axe)
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: make env
      # The e2e override only lifts the per-address limits that a test run would otherwise exhaust.
      - run: make up-e2e
      - name: The recorded transcripts on the landing page still match what the stack answers
        run: node scripts/record-transcripts.mjs --check
      - name: The audit chain notices an edit made behind the application
        run: ./scripts/tamper-demo.sh
      - name: Browser tests (desktop and phone)
        run: make e2e-browser
      - name: Test results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with: { name: browser-test-results, path: web/test-results, if-no-files-found: ignore }
      - name: Logs on failure
        if: failure()
        run: docker compose logs --no-color --tail=200
      - run: docker compose down -v
