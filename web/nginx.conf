# Same-origin front door: the SPA, the API and the websocket all live behind one host, so the browser needs no CORS
# and the API is never exposed directly.

map $http_upgrade $connection_upgrade { default upgrade; '' close; }

# Trust X-Forwarded-For only from the proxy tier; here this nginx IS the edge, so it sets it from the socket address.
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  server_tokens off;

  include /etc/nginx/snippets/security-headers.conf;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  location = /healthz { access_log off; default_type text/plain; return 200 "ok\n"; }

  location /api/ {
    proxy_pass http://api:3000/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # overwrite, never append: a client-supplied header must not survive
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    client_max_body_size 1m;
  }

  location /socket.io/ {
    proxy_pass http://api:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 1h;
  }

  # The console (React SPA) lives under /app/. Hashed build assets are immutable; the HTML shell must always be
  # revalidated so a deploy takes effect at once.
  location = /app { return 301 /app/; }
  location /app/assets/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }
  location /app/ {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri /app/index.html;
  }

  # The landing page and the lab are plain static files at the root. No SPA fallback here: an unknown path is a 404.
  location / {
    include /etc/nginx/snippets/security-headers.conf;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ =404;
  }
}
